<style>
    .four-square {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1em;
    }
    .four-square a {
        display: block;
    }
    .thumb {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    @media (min-width: 769px) {
        .four-square {
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            width: min(100%, calc(100vh - 10em));
            aspect-ratio: 1 / 1;
        }
    }
</style>
